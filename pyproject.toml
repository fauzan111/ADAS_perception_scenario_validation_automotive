[project]
name = "adas-perception-validation"
version = "0.1.0"
description = "3D perception on nuScenes plus scenario-based validation with safety metrics."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
perception = ["nuscenes-devkit>=1.1.11", "torch>=2.4", "torchvision>=0.19"]
sim = ["metadrive-simulator>=0.4.2"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adas_validation"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ros2_ws"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
